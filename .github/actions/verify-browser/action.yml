name: Verify packaged release browser
description: Verify the pinned Playwright image matches the installed test package.
inputs:
  browser:
    description: Playwright browser to verify
    required: true
runs:
  using: composite
  steps:
    - name: Align temporary runner home ownership
      shell: bash
      run: |
        # GitHub mounts its temporary home as the host runner user, while the
        # official image runs as root. Firefox requires matching ownership.
        if [[ "$HOME" == "/github/home" && "$(id -u)" == "0" ]]; then
          chown "$(id -u):$(id -g)" /github/home
        fi
        # Checkout's temporary Git configuration does not cover later shell
        # steps in this container. Trust only this checked-out workspace.
        git config --global --add safe.directory "${GITHUB_WORKSPACE:?}"
        git rev-parse --show-toplevel
        git ls-files -c -o --exclude-standard -z > /dev/null
    - name: Verify package version and browser executable
      shell: bash
      env:
        RELEASE_BROWSER: ${{ inputs.browser }}
      run: |
        node <<'NODE'
        const assert = require('node:assert/strict');
        const fs = require('node:fs');
        const version = require('@playwright/test/package.json').version;
        assert.equal(version, '1.60.0', 'Update the pinned CI image with the Playwright package.');
        const name = process.env.RELEASE_BROWSER;
        assert.ok(['chromium', 'firefox', 'webkit'].includes(name));
        const browser = require('playwright')[name];
        assert.ok(fs.existsSync(browser.executablePath()), `Missing packaged ${name} executable`);
        (async () => {
          const launched = await browser.launch();
          await launched.close();
          console.log(`Verified Playwright ${version}: ${name} launches`);
        })().catch(error => { console.error(error); process.exitCode = 1; });
        NODE
